    <!-- Early page visit tracking - fires immediately before React -->
    <script type="text/javascript">
      (function() {
        // Generate or retrieve session ID
        function getSessionId() {
          var sid = sessionStorage.getItem('analytics_session_id');
          if (!sid) {
            sid = 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            sessionStorage.setItem('analytics_session_id', sid);
          }
          return sid;
        }
        
        // Detect device type
        function getDevice() {
          var ua = navigator.userAgent.toLowerCase();
          if (/iphone|ipod/.test(ua)) return 'ios';
          if (/android/.test(ua) && /mobile/.test(ua)) return 'android';
          if (/ipad|android/.test(ua)) return 'tablet';
          return 'desktop';
        }
        
        // Track page visit to Supabase immediately
        function trackEarlyVisit() {
          var sessionId = getSessionId();
          var params = new URLSearchParams(window.location.search);
          
          // TBLS attribution capture (first-touch: check localStorage)
          var tblsPageId = params.get('tbls_page') || params.get('tbls_page_id');
          var tblsPinId = params.get('tbls_pin') || params.get('tbls_pin_id');
          var tblsTemplate = params.get('tbls_template');
          
          // Store TBLS params in localStorage for downstream events (first-touch only)
          try {
            if (tblsPageId && !localStorage.getItem('tbls_page_id')) localStorage.setItem('tbls_page_id', tblsPageId);
            if (tblsPinId && !localStorage.getItem('tbls_pin_id')) localStorage.setItem('tbls_pin_id', tblsPinId);
            if (tblsTemplate && !localStorage.getItem('tbls_template')) localStorage.setItem('tbls_template', tblsTemplate);
          } catch(e) {}
          
          // Read from localStorage (may have been set on earlier visit)
          try {
            tblsPageId = tblsPageId || localStorage.getItem('tbls_page_id');
            tblsPinId = tblsPinId || localStorage.getItem('tbls_pin_id');
            tblsTemplate = tblsTemplate || localStorage.getItem('tbls_template');
          } catch(e) {}
          
          var data = {
            session_id: sessionId,
            path: window.location.pathname,
            referrer: document.referrer || null,
            user_agent: navigator.userAgent,
            device_type: getDevice(),
            utm_source: params.get('utm_source'),
            utm_medium: params.get('utm_medium'),
            utm_campaign: params.get('utm_campaign'),
            tbls_page_id: tblsPageId || null,
            tbls_pin_id: tblsPinId || null,
            tbls_template: tblsTemplate || null
          };
          
          // Fire and forget - use sendBeacon for reliability
          var url = 'https://ofryballwrjrgivokzln.supabase.co/rest/v1/page_visits';
          var headers = {
            'Content-Type': 'application/json',
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mcnliYWxsd3Jqcmdpdm9remxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ1ODE1NDAsImV4cCI6MjA4MDE1NzU0MH0.MklZLF9wx-VVOlu-ArQ_h2rEHfSvEbGnUmCynbU7F54',
            'Prefer': 'return=minimal'
          };
          
          // Use fetch with keepalive for reliability even on quick bounces
          fetch(url, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(data),
            keepalive: true
          }).catch(function() {});
        }
        
        // Track immediately
        trackEarlyVisit();
        
        // Also expose session ID for React to use (prevents duplicate tracking)
        window.__earlyTrackingDone = true;
        window.__sessionId = getSessionId();
      })();
    </script>

    <!-- Third-party scripts: Meta Pixel loads immediately for Facebook traffic, others deferred -->
    <script type="text/javascript">
      (function() {
        var scriptsLoaded = false;
        var metaPixelLoaded = false;
        
        // Check if this is Facebook/Meta traffic that needs immediate pixel loading
        function isFacebookTraffic() {
          var params = new URLSearchParams(window.location.search);
          // Load immediately if: fbclid present OR utm_source=facebook OR utm_medium=paid_social
          return params.has('fbclid') || 
                 params.get('utm_source') === 'facebook' ||
                 params.get('utm_source') === 'fb' ||
                 params.get('utm_source') === 'meta' ||
                 params.get('utm_medium') === 'paid_social' ||
                 params.get('utm_medium') === 'cpc' && (params.get('utm_source') || '').includes('facebook');
        }
        
        // Get the parent domain for cross-subdomain cookie sharing
        // e.g., risebynight.com from checkout.risebynight.com
        function getParentDomain() {
          try {
            var hostname = window.location.hostname;
            // If we're on localhost or IP, skip domain attribute
            if (hostname === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(hostname)) {
              return null;
            }
            // Extract parent domain (e.g., .risebynight.com)
            var parts = hostname.split('.');
            if (parts.length >= 2) {
              return '.' + parts.slice(-2).join('.');
            }
            return null;
          } catch(e) { return null; }
        }
        
        // Extract fbclid from URL and construct _fbc if cookie is missing
        function captureMetaCookies() {
          try {
            var params = new URLSearchParams(window.location.search);
            var fbclid = params.get('fbclid');
            var parentDomain = getParentDomain();
            var domainAttr = parentDomain ? '; domain=' + parentDomain : '';
            
            // Read existing cookies
            var existingFbc = document.cookie.match(/(^| )_fbc=([^;]+)/);
            var existingFbp = document.cookie.match(/(^| )_fbp=([^;]+)/);
            
            // If fbclid exists in URL but _fbc cookie doesn't exist, construct it
            // Format: fb.1.{timestamp_ms}.{fbclid}
            if (fbclid && !existingFbc) {
              var fbc = 'fb.1.' + Date.now() + '.' + fbclid;
              // Set cookie with 90 day expiry, cross-subdomain (Meta standard)
              var expiry = new Date(Date.now() + 90 * 24 * 60 * 60 * 1000).toUTCString();
              var secure = window.location.protocol === 'https:' ? '; Secure' : '';
              document.cookie = '_fbc=' + encodeURIComponent(fbc) + '; expires=' + expiry + '; path=/' + domainAttr + '; SameSite=Lax' + secure;
            }
            
            // Persist to localStorage as fallback (cross-session recovery)
            var fbc = existingFbc ? existingFbc[2] : document.cookie.match(/(^| )_fbc=([^;]+)/)?.[2];
            var fbp = existingFbp ? existingFbp[2] : null;
            
            if (fbc && typeof localStorage !== 'undefined') {
              localStorage.setItem('meta_fbc', fbc);
            }
            if (fbp && typeof localStorage !== 'undefined') {
              localStorage.setItem('meta_fbp', fbp);
            }
            
            // Store for React consumption
            window.__metaFbc = fbc || null;
            window.__metaFbp = fbp || null;
          } catch(e) { /* Silent fail - tracking must not break page */ }
        }
        
        // Load Meta Pixel immediately (for Facebook traffic or when called later)
        function loadMetaPixel() {
          if (metaPixelLoaded) return;
          metaPixelLoaded = true;
          
          !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
          fbq('init', '1419388323215799');
          fbq('track', 'PageView');
          
          // Re-capture cookies after pixel initializes (pixel may set _fbp)
          // Two recaptures: 500ms for fast devices, 2000ms for slow devices
          setTimeout(captureMetaCookies, 500);
          setTimeout(captureMetaCookies, 2000);
        }
        
        function loadDeferredScripts() {
          if (scriptsLoaded) return;
          scriptsLoaded = true;
          
          // Klaviyo Onsite (handles both _learnq and _klOnsite)
          var kl = document.createElement('script');
          kl.async = true;
          kl.src = 'https://static.klaviyo.com/onsite/js/klaviyo.js?company_id=ThHaCi';
          document.head.appendChild(kl);
          
          // Microsoft Clarity
          (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
          })(window, document, "clarity", "script", "ue7ibjdmdj");
          
          // Pinterest Tag
          !function(e){if(!window.pintrk){window.pintrk=function(){window.pintrk.queue.push(Array.prototype.slice.call(arguments))};var n=window.pintrk;n.queue=[],n.version="3.0";var t=document.createElement("script");t.async=!0,t.src=e;var r=document.getElementsByTagName("script")[0];r.parentNode.insertBefore(t,r)}}("https://s.pinimg.com/ct/core.js");
          pintrk('load', '2612541212823');
          pintrk('page');
          
          // Load Meta Pixel if not already loaded (for non-Facebook traffic)
          loadMetaPixel();
          
          // Google Ads (gtag.js)
          var gtagScript = document.createElement('script');
          gtagScript.async = true;
          gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=AW-17903761568';
          document.head.appendChild(gtagScript);
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'AW-17903761568');
          
          // Cleanup listeners
          window.removeEventListener('scroll', loadDeferredScripts);
          window.removeEventListener('click', loadDeferredScripts);
          window.removeEventListener('touchstart', loadDeferredScripts);
        }
        
        // Capture Meta cookies IMMEDIATELY on page load (before any deferral)
        captureMetaCookies();
        
        // If Facebook traffic: load Meta Pixel immediately, defer others
        if (isFacebookTraffic()) {
          loadMetaPixel();
        }
        
        // Load other scripts on first user interaction OR after 5s timeout
        window.addEventListener('scroll', loadDeferredScripts, { passive: true, once: true });
        window.addEventListener('click', loadDeferredScripts, { once: true });
        window.addEventListener('touchstart', loadDeferredScripts, { passive: true, once: true });
        setTimeout(loadDeferredScripts, 5000);
      })();
    </script>
